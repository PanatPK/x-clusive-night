<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X-CLUSIVE NIGHT · Drinks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ============================================================
   ตั้งค่าตรงนี้ที่เดียว
   ============================================================ */
const SHOP = {
  name: 'X-CLUSIVE NIGHT',
  logo: 'img/logo.png',        // โลโก้งาน (วางไฟล์ไว้ตามนี้ ถ้าไม่มีไฟล์จะใช้ตัวอักษรแทน)
  adminPin: '0610',            // PIN ปุ่มแอดมินบนจอบาร์
};
const TABLES = ['1', '2', 'VIP 1', 'VIP 2'].concat(Array.from({ length: 18 }, (_, i) => String(i + 5)));

// Firebase: วาง config จาก Project settings → Your apps
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

// เมนู 6 รายการ  img = ไฟล์รูป (โฟลเดอร์ img ข้างไฟล์นี้ หรือ URL)  ใส่ soldOut:true ถ้าหมด
const MENU = [
  { id: 'd1', name: 'เมนู 1', desc: '', img: 'img/d1.jpg' },
  { id: 'd2', name: 'เมนู 2', desc: '', img: 'img/d2.jpg' },
  { id: 'd3', name: 'เมนู 3', desc: '', img: 'img/d3.jpg' },
  { id: 'd4', name: 'เมนู 4', desc: '', img: 'img/d4.jpg' },
  { id: 'd5', name: 'เมนู 5', desc: '', img: 'img/d5.jpg' },
  { id: 'd6', name: 'เมนู 6', desc: '', img: 'img/d6.jpg' },
];
</script>
<style>
:root{
  --bg:#FFFFFF; --ink:#000000; --ink-2:#808285; --line:#D9D9D9; --soft:#EDEDED; --card:#FFFFFF;
  --red:#BA0C2F; --red-ink:#FFFFFF; --ok:#1C7C3A; --warn:#BA0C2F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt',system-ui,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer;border:0;border-radius:4px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%;background:#fff}
.hidden{display:none!important}
.muted{color:var(--ink-2)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}

/* โลโก้ */
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 0 10px;text-align:center}
.logo img{max-width:230px;width:60%;height:auto;display:block}
.logo .wm{font-weight:300;font-size:30px;letter-spacing:.06em;line-height:1;color:#000}
.logo .wm b{font-weight:700;color:var(--red)}
.logo .sub{font-size:11px;letter-spacing:.32em;color:var(--ink-2);margin-top:2px}

/* เลือกโต๊ะ */
.pick h2{font-size:15px;font-weight:500;text-align:center;margin:18px 0 12px;color:var(--ink-2)}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tgrid button{background:#fff;border:1.5px solid var(--ink);color:var(--ink);padding:16px 4px;font-size:20px;font-weight:600;border-radius:4px;transition:background .12s,color .12s}
.tgrid button.vip{font-size:15px;letter-spacing:.04em}
.tgrid button.on{background:var(--red);border-color:var(--red);color:#fff}
.primary{background:var(--red);color:var(--red-ink);padding:14px 22px;font-weight:600;font-size:16px;width:100%}
.primary:disabled{background:var(--soft);color:var(--ink-2);cursor:default}
.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink);padding:10px 16px;font-weight:500}
.redline{background:var(--red);color:#fff;border-color:var(--red)}

/* หน้าสั่ง */
.head{display:flex;align-items:center;gap:12px;padding:14px 0 6px}
.head img{height:36px;width:auto}
.head .wm{font-weight:300;font-size:18px;letter-spacing:.06em}
.head .wm b{font-weight:700;color:var(--red)}
.head .tb{margin-left:auto;text-align:right;line-height:1.1}
.head .tb small{display:block;color:var(--ink-2);font-size:11px;letter-spacing:.2em}
.head .tb b{font-size:26px;font-weight:700}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.m{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.m.out{opacity:.45}
.m.has{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.m .im{width:100%;aspect-ratio:1;object-fit:cover;background:var(--soft);display:block}
.m .im.ph{display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:12px}
.m .b{padding:10px 10px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
.m .nm{font-weight:600;font-size:15px;line-height:1.25}
.m .ds{font-size:12px;color:var(--ink-2);margin-top:-6px}
.qty{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--ink);border-radius:4px;margin-top:auto}
.qty button{width:38px;height:36px;background:transparent;color:var(--ink);font-size:20px;font-weight:600;border-radius:0}
.qty button.add{background:var(--ink);color:#fff}
.m.has .qty{border-color:var(--red)}
.m.has .qty button.add{background:var(--red)}
.qty span{font-weight:600;min-width:20px;text-align:center}
.m textarea{font-size:13px;padding:7px 9px;resize:none;border-radius:4px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;line-height:1.2}
.bar .sum b{font-size:18px}
.bar .primary{width:auto}
.done{text-align:center;padding:50px 0}
.done .big{font-size:72px;font-weight:700;color:var(--red);line-height:1;letter-spacing:-.02em}
.pill{display:inline-block;padding:6px 16px;border-radius:999px;border:1.5px solid var(--ink);font-weight:500;margin-top:14px}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.msg{background:#FBE7EB;color:var(--red);padding:12px 14px;border-radius:4px;margin:12px 0}

/* จอบาร์ */
.barwrap{padding:12px 16px 40px;max-width:1200px;margin:0 auto}
.barhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.barhead h1{margin:0;font-size:18px;font-weight:300;letter-spacing:.06em;flex:1}
.barhead h1 b{font-weight:700;color:var(--red)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.dot{width:10px;height:10px;border-radius:50%;background:#C4C4C4}
.dot.on{background:var(--ok)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.col h2{font-size:14px;font-weight:500;color:var(--ink-2);margin:0 0 8px;display:flex;justify-content:space-between;letter-spacing:.04em}
.col h2 span{background:var(--ink);color:#fff;border-radius:999px;padding:0 10px;font-size:12px}
.order{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ink);border-radius:4px;padding:12px 14px;margin-bottom:10px}
.order.new{border-left-color:var(--red)}
.order.done{border-left-color:var(--ok)}
.order .h{display:flex;align-items:baseline;gap:10px}
.order .h .t{font-size:26px;font-weight:700;line-height:1}
.order .h .no{color:var(--ink-2)}
.order .h .ago{margin-left:auto;font-size:13px;color:var(--ink-2)}
.order ul{list-style:none;padding:0;margin:8px 0}
.order li{padding:3px 0}
.order li b{color:var(--red);margin-right:8px}
.order li .nt{display:block;font-size:13px;color:#7A4A00;background:#FFF4DC;padding:3px 8px;border-radius:3px;margin-top:3px}
.order .acts{display:flex;gap:8px;margin-top:8px}
.order .acts button{padding:9px 14px;font-weight:600;font-size:14px}
.order .acts .primary{width:auto}
.empty{color:var(--ink-2);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:4px}

/* รายงาน */
.rep{max-width:900px;margin:0 auto;padding:16px}
.rep table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 24px}
.rep th,.rep td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.rep th{font-weight:600;background:var(--soft)}
.rep td.n,.rep th.n{text-align:right}
.rep h2{font-size:16px;margin:22px 0 4px}
.kpi{display:flex;gap:14px;flex-wrap:wrap}
.kpi div{border:1.5px solid var(--ink);border-radius:4px;padding:10px 16px;min-width:120px}
.kpi b{display:block;font-size:28px;line-height:1.1}

/* QR A5 */
.qrtop{display:flex;gap:10px;align-items:center;padding:16px;max-width:900px;margin:0 auto}
.qrpage{width:148mm;height:210mm;margin:12px auto;background:#fff;color:#000;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7mm;padding:14mm;page-break-after:always;break-after:page}
.qrpage .logo{padding:0}
.qrpage .logo .wm{font-size:26pt}
.qrpage .tl{font-size:12pt;letter-spacing:.3em;color:#808285}
.qrpage .tn{font-size:60pt;font-weight:700;line-height:1;margin-top:-5mm}
.qrpage .tn.vip{font-size:44pt}
.qrpage .q{padding:5mm;border:2px solid #000;background:#fff}
.qrpage .q img,.qrpage .q canvas{display:block}
.qrpage .hint{font-size:13pt}
.qrpage .hint small{display:block;font-size:10pt;color:#808285;font-weight:300}
@media print{ @page{size:A5;margin:0} body{background:#fff} .noprint{display:none} .qrpage{margin:0;border:0} }

.setup{max-width:560px;margin:40px auto;padding:0 16px}
.setup code{background:#eee;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- ส่วนกลาง ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const params = new URLSearchParams(location.search);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const findItem = id => MENU.find(i => i.id === id);
const isVip = t => /vip/i.test(t);
const tableLabel = t => isVip(t) ? t : 'โต๊ะ ' + t;
const LOGO = `<div class="logo"><img src="${esc(SHOP.logo)}" alt="${esc(SHOP.name)}" onerror="this.outerHTML='<div class=&quot;wm&quot;><b>X</b>-CLUSIVE NIGHT</div>'"><div class="sub">STIEBEL ELTRON</div></div>`;
const LOGO_SM = `<img src="${esc(SHOP.logo)}" alt="" onerror="this.outerHTML='<span class=&quot;wm&quot;><b>X</b>-CLUSIVE NIGHT</span>'">`;

let db = null;
if (FIREBASE_CONFIG.projectId) { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); }

function dayKey(d = new Date()) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
function timeStr(ts) { const d = ts?.toDate ? ts.toDate() : new Date(); return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }); }
function ago(ts) { if (!ts?.toDate) return ''; const m = Math.round((Date.now() - ts.toDate().getTime()) / 60000); return m < 1 ? 'เมื่อกี้' : m + ' นาที'; }

if (!db) renderSetup();
else if (params.has('bar')) renderBar();
else if (params.has('qr')) renderQR();
else if (params.has('report')) renderReport();
else if (params.get('table')) renderOrder(params.get('table'));
else renderPick();

function renderSetup() {
  app.innerHTML = `<div class="setup">${LOGO}<h1>ยังไม่ได้ตั้งค่า</h1>
    <p>ใส่ค่า <code>FIREBASE_CONFIG</code> ด้านบนสุดของไฟล์นี้ก่อน</p>
<pre style="background:#eee;padding:12px;border-radius:4px;overflow:auto">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /orders/{id} { allow read, write: if true; }
    match /counters/{id} { allow read, write: if true; }
  }
}</pre>
    <p class="muted">หน้าสั่ง = ไม่มีพารามิเตอร์ (เลือกโต๊ะ) หรือ <code>?table=1</code> · จอบาร์ <code>?bar</code> · QR <code>?qr</code> · สรุป <code>?report</code></p></div>`;
}

/* ---------- เลือกโต๊ะ ---------- */
function renderPick() {
  let sel = null;
  app.innerHTML = `<div class="wrap">${LOGO}<div class="pick"><h2>เลือกโต๊ะของคุณ</h2>
    <div class="tgrid" id="tg">${TABLES.map(t => `<button class="${isVip(t) ? 'vip' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <p style="margin-top:22px"><button class="primary" id="go" disabled>สั่งเครื่องดื่ม</button></p></div></div>`;
  $('#tg').addEventListener('click', e => {
    const b = e.target.closest('button[data-t]'); if (!b) return;
    document.querySelectorAll('#tg button').forEach(x => x.classList.toggle('on', x === b));
    sel = b.dataset.t; $('#go').disabled = false;
  });
  $('#go').onclick = () => { if (sel) location.search = '?table=' + encodeURIComponent(sel); };
}

/* ---------- หน้าสั่ง ---------- */
function renderOrder(table) {
  if (!TABLES.includes(table)) { renderPick(); return; }
  const cart = {}; // id -> {qty, note}
  const count = () => Object.values(cart).reduce((a, b) => a + b.qty, 0);

  app.innerHTML = `<div class="wrap">
    <div class="head">${LOGO_SM}<div class="tb"><small>TABLE</small><b>${esc(table)}</b></div></div>
    <div class="mgrid" id="menu"></div>
    <div id="err"></div></div>
  <div class="bar"><div class="in"><div class="sum"><div class="muted" id="cnt">ยังไม่ได้เลือก</div></div>
    <button class="primary" id="send" disabled>สั่งเครื่องดื่ม</button></div></div>`;

  const menuEl = $('#menu');
  menuEl.innerHTML = MENU.map(i => `
    <div class="m ${i.soldOut ? 'out' : ''}" id="m-${i.id}">
      ${i.img ? `<img class="im" src="${esc(i.img)}" alt="" onerror="this.className='im ph';this.outerHTML='<div class=&quot;im ph&quot;>รูปเมนู</div>'">` : '<div class="im ph">รูปเมนู</div>'}
      <div class="b"><div class="nm">${esc(i.name)}</div>${i.desc ? `<div class="ds">${esc(i.desc)}</div>` : ''}
        ${i.soldOut ? '<div class="muted">หมด</div>' : `
        <div class="qty"><button data-id="${i.id}" data-d="-1" aria-label="ลด">−</button><span id="q-${i.id}">0</span><button class="add" data-id="${i.id}" data-d="1" aria-label="เพิ่ม">+</button></div>
        <textarea rows="1" class="hidden" id="n-${i.id}" placeholder="หมายเหตุ เช่น หวานน้อย"></textarea>`}
      </div></div>`).join('');

  menuEl.addEventListener('click', e => {
    const b = e.target.closest('button[data-id]'); if (!b) return;
    const id = b.dataset.id, d = +b.dataset.d;
    const c = cart[id] || { qty: 0, note: '' };
    c.qty = Math.max(0, c.qty + d);
    if (c.qty) cart[id] = c; else delete cart[id];
    $('#q-' + id).textContent = c.qty;
    $('#m-' + id).classList.toggle('has', c.qty > 0);
    $('#n-' + id).classList.toggle('hidden', c.qty === 0);
    const n = count();
    $('#cnt').textContent = n ? 'เลือกแล้ว ' + n + ' แก้ว' : 'ยังไม่ได้เลือก';
    $('#send').disabled = !n;
  });

  $('#send').onclick = async () => {
    const btn = $('#send'); btn.disabled = true; btn.textContent = 'กำลังส่ง…'; $('#err').innerHTML = '';
    try {
      const items = Object.entries(cart).map(([id, c]) => ({ id, name: findItem(id).name, qty: c.qty, note: ($('#n-' + id).value || '').trim() }));
      const key = dayKey();
      const no = await db.runTransaction(async tx => {
        const ref = db.collection('counters').doc(key); const snap = await tx.get(ref);
        const next = (snap.exists ? snap.data().n : 0) + 1; tx.set(ref, { n: next }); return next;
      });
      const doc = await db.collection('orders').add({
        no, table, items, qty: count(), status: 'new', printed: false, day: key,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      showDone(doc.id, no);
    } catch (e) {
      $('#err').innerHTML = `<div class="msg">ส่งไม่สำเร็จ ลองอีกครั้ง หรือแจ้งพนักงานได้เลย<br><small>${esc(e.message)}</small></div>`;
      btn.disabled = false; btn.textContent = 'สั่งเครื่องดื่ม';
    }
  };

  function showDone(id, no) {
    app.innerHTML = `<div class="wrap">${LOGO}<div class="done">
      <div class="muted">รับออเดอร์แล้ว · ${esc(tableLabel(table))}</div><div class="big">#${no}</div>
      <div class="pill" id="st">รอบาร์รับ</div>
      <p class="muted" style="margin-top:28px;font-size:14px">หน้านี้จะอัปเดตเองเมื่อเครื่องดื่มเสร็จ</p>
      <p><button class="ghost" onclick="location.reload()">สั่งเพิ่ม</button></p></div></div>`;
    db.collection('orders').doc(id).onSnapshot(s => {
      const st = s.data()?.status, el = $('#st'); if (!el) return;
      el.className = 'pill' + (st === 'done' || st === 'served' ? ' ok' : '');
      el.textContent = { new: 'รอบาร์รับ', doing: 'กำลังทำ', done: 'เสร็จแล้ว กำลังไปเสิร์ฟ', served: 'เสิร์ฟแล้ว' }[st] || st || '';
    });
  }
}

/* ---------- จอบาร์ ---------- */
let printer = null, autoPrint = true, inflight = new Set(), firstLoad = true;
const BLE = [
  { s: '000018f0-0000-1000-8000-00805f9b34fb', c: '00002af1-0000-1000-8000-00805f9b34fb' },
  { s: '49535343-fe7d-4ae5-8fa9-9fafd205e455', c: '49535343-8841-43f4-a8d4-ecbe34729bb3' },
  { s: 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', c: 'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f' },
  { s: '0000ff00-0000-1000-8000-00805f9b34fb', c: '0000ff02-0000-1000-8000-00805f9b34fb' },
];

function renderBar() {
  app.innerHTML = `<div class="barwrap">
    <div class="barhead"><h1><b>X</b>-CLUSIVE NIGHT · BAR</h1>
      <div class="status"><span class="dot" id="pdot"></span><span id="ptxt">ยังไม่ต่อปริ้นเตอร์</span></div>
      <button class="ghost" id="connect">ต่อปริ้นเตอร์</button>
      <button class="ghost" id="test">ทดสอบพิมพ์</button>
      <label class="switch"><input type="checkbox" id="auto" checked> พิมพ์อัตโนมัติ</label>
      <a class="ghost" style="text-decoration:none" href="?report" target="_blank">สรุป</a>
      <button class="ghost redline" id="clear">ล้างออเดอร์ (ทดสอบ)</button>
    </div>
    <div class="cols">
      <div class="col"><h2>ใหม่ <span id="cNew">0</span></h2><div id="lNew"></div></div>
      <div class="col"><h2>กำลังทำ <span id="cDoing">0</span></h2><div id="lDoing"></div></div>
      <div class="col"><h2>เสร็จ รอเสิร์ฟ <span id="cDone">0</span></h2><div id="lDone"></div></div>
    </div></div>`;

  $('#connect').onclick = connectPrinter;
  $('#test').onclick = () => printOrder({ no: 0, table: 'VIP 1', items: [{ name: 'เมนูทดสอบ A', qty: 2, note: 'หวานน้อย' }, { name: 'เมนูทดสอบ B', qty: 1, note: '' }], createdAt: null }).catch(e => alert(e.message));
  $('#auto').onchange = e => autoPrint = e.target.checked;
  $('#clear').onclick = clearAll;
  if (!navigator.bluetooth) $('#ptxt').textContent = 'เบราว์เซอร์นี้ไม่รองรับ Bluetooth (ใช้ Chrome บน Android หรือ Bluefy บน iPad)';

  db.collection('orders').where('day', '==', dayKey()).onSnapshot(snap => {
    const all = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.no || 0) - (b.no || 0));
    if (!firstLoad && snap.docChanges().some(c => c.type === 'added')) beep();
    firstLoad = false;
    drawCol('New', all.filter(o => o.status === 'new'));
    drawCol('Doing', all.filter(o => o.status === 'doing'));
    drawCol('Done', all.filter(o => o.status === 'done'));
    if (autoPrint && printer) all.filter(o => o.status === 'new' && !o.printed && !inflight.has(o.id)).forEach(o => printAndMark(o));
  }, e => alert('อ่านออเดอร์ไม่ได้: ' + e.message));
  setInterval(() => document.querySelectorAll('[data-ago]').forEach(el => el.textContent = ago({ toDate: () => new Date(+el.dataset.ago) })), 30000);
}

function drawCol(name, list) {
  $('#c' + name).textContent = list.length;
  $('#l' + name).innerHTML = list.length ? list.map(o => `
    <div class="order ${o.status}">
      <div class="h"><div class="t">${esc(tableLabel(o.table))}</div><div class="no">#${o.no}</div>
        <div class="ago" data-ago="${o.createdAt?.toDate ? o.createdAt.toDate().getTime() : Date.now()}">${ago(o.createdAt)}</div></div>
      <ul>${o.items.map(i => `<li><b>${i.qty}×</b>${esc(i.name)}${i.note ? `<span class="nt">${esc(i.note)}</span>` : ''}</li>`).join('')}</ul>
      <div class="acts">
        ${o.status === 'new' ? `<button class="primary" onclick="setStatus('${o.id}','doing')">รับทำ</button>` : ''}
        ${o.status === 'doing' ? `<button class="primary" onclick="setStatus('${o.id}','done')">เสร็จแล้ว</button>` : ''}
        ${o.status === 'done' ? `<button class="primary" onclick="setStatus('${o.id}','served')">เสิร์ฟแล้ว</button>` : ''}
        <button class="ghost" onclick="reprint('${o.id}')">${o.printed ? 'พิมพ์อีกครั้ง' : 'พิมพ์'}</button>
      </div></div>`).join('') : '<div class="empty">ว่าง</div>';
}
window.setStatus = (id, status) => db.collection('orders').doc(id).update({ status });
window.reprint = async id => {
  const s = await db.collection('orders').doc(id).get();
  try { await printOrder({ id, ...s.data() }); await s.ref.update({ printed: true }); } catch (e) { alert('พิมพ์ไม่ได้: ' + e.message); }
};
async function printAndMark(o) {
  inflight.add(o.id);
  try { await printOrder(o); await db.collection('orders').doc(o.id).update({ printed: true }); } catch (e) { console.warn(e); } finally { inflight.delete(o.id); }
}
async function clearAll() {
  if (prompt('ใส่ PIN แอดมิน') !== SHOP.adminPin) return;
  if (!confirm('ลบออเดอร์ทั้งหมดและเริ่มนับเลขใหม่? ข้อมูลสรุปจะหายด้วย')) return;
  const snap = await db.collection('orders').get();
  const docs = snap.docs;
  for (let i = 0; i < docs.length; i += 400) { const b = db.batch(); docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
  const cs = await db.collection('counters').get(); const b = db.batch(); cs.docs.forEach(d => b.delete(d.ref)); await b.commit();
  alert('ล้างแล้ว ' + docs.length + ' ออเดอร์');
}
function beep() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .2; o.start(); o.stop(a.currentTime + .25); } catch {}
}

/* Bluetooth */
async function connectPrinter() {
  try {
    const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BLE.map(x => x.s) });
    const server = await device.gatt.connect();
    let ch = null;
    for (const b of BLE) { try { ch = await (await server.getPrimaryService(b.s)).getCharacteristic(b.c); break; } catch {} }
    if (!ch) for (const svc of await server.getPrimaryServices()) {
      for (const c of await svc.getCharacteristics()) if (c.properties.write || c.properties.writeWithoutResponse) { ch = c; break; }
      if (ch) break;
    }
    if (!ch) throw new Error('หาช่องส่งข้อมูลของปริ้นเตอร์ไม่เจอ');
    printer = { device, ch };
    device.addEventListener('gattserverdisconnected', () => { printer = null; printerUI(); });
    printerUI();
  } catch (e) { alert('ต่อไม่ได้: ' + e.message); }
}
function printerUI() {
  $('#pdot').className = 'dot' + (printer ? ' on' : '');
  $('#ptxt').textContent = printer ? 'ต่อแล้ว: ' + (printer.device.name || 'ปริ้นเตอร์') : 'ยังไม่ต่อปริ้นเตอร์';
}
async function send(bytes) {
  if (!printer) throw new Error('ยังไม่ได้ต่อปริ้นเตอร์');
  for (let i = 0; i < bytes.length; i += 100) {
    const part = bytes.slice(i, i + 100);
    if (printer.ch.properties.writeWithoutResponse) await printer.ch.writeValueWithoutResponse(part); else await printer.ch.writeValue(part);
    await sleep(15);
  }
}

/* บิลเป็นภาพ → raster */
const W = 384;
function drawReceipt(o) {
  const c = document.createElement('canvas'); c.width = W; c.height = 1400;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, c.height); x.fillStyle = '#000';
  const F = 'Prompt, sans-serif'; let y = 10;
  const line = (t, size, weight = 600, align = 'left') => { x.font = `${weight} ${size}px ${F}`; x.textAlign = align; x.fillText(t, align === 'center' ? W / 2 : 8, y + size); y += size * 1.35; };
  const rule = () => { x.fillRect(8, y + 4, W - 16, 2); y += 14; };
  const wrap = (t, size, weight, indent, maxW) => { x.font = `${weight} ${size}px ${F}`; x.textAlign = 'left'; let cur = '';
    for (const ch of t) { if (x.measureText(cur + ch).width > maxW) { x.fillText(cur, indent, y + size); y += size * 1.3; cur = ch; } else cur += ch; }
    x.fillText(cur, indent, y + size); y += size * 1.35; };
  line('X-CLUSIVE NIGHT', 26, 700, 'center');
  line(`#${o.no}   ${timeStr(o.createdAt)}`, 22, 400, 'center');
  rule();
  line(isVip(o.table) ? o.table : 'โต๊ะ ' + o.table, isVip(o.table) ? 48 : 56, 700, 'center');
  rule();
  for (const it of o.items) {
    x.font = `700 30px ${F}`; x.textAlign = 'left'; x.fillText(it.qty + '×', 8, y + 30); wrap(it.name, 30, 600, 64, W - 72);
    if (it.note) wrap('» ' + it.note, 24, 400, 64, W - 72);
    y += 6;
  }
  y += 20;
  const out = document.createElement('canvas'); out.width = W; out.height = Math.min(y, c.height);
  out.getContext('2d').drawImage(c, 0, 0); return out;
}
function rasterBytes(canvas) {
  const h = canvas.height, d = canvas.getContext('2d').getImageData(0, 0, W, h).data, bpr = W / 8;
  const chunks = [new Uint8Array([0x1B, 0x40, 0x1B, 0x61, 0x00])];
  for (let y0 = 0; y0 < h; y0 += 255) {
    const rows = Math.min(255, h - y0), buf = new Uint8Array(8 + bpr * rows);
    buf.set([0x1D, 0x76, 0x30, 0x00, bpr & 255, bpr >> 8, rows & 255, rows >> 8]);
    for (let y = 0; y < rows; y++) for (let xx = 0; xx < W; xx++) {
      const i = ((y0 + y) * W + xx) * 4, lum = d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11;
      if (lum < 128) buf[8 + y * bpr + (xx >> 3)] |= 0x80 >> (xx & 7);
    }
    chunks.push(buf);
  }
  chunks.push(new Uint8Array([0x1B, 0x64, 0x04]));
  const all = new Uint8Array(chunks.reduce((s, b) => s + b.length, 0)); let p = 0;
  for (const b of chunks) { all.set(b, p); p += b.length; } return all;
}
async function printOrder(o) { await document.fonts.ready; await send(rasterBytes(drawReceipt(o))); }

/* ---------- สรุป ---------- */
async function renderReport() {
  app.innerHTML = `<div class="rep"><h1 style="font-weight:300;letter-spacing:.06em"><b style="color:var(--red)">X</b>-CLUSIVE NIGHT · สรุปออเดอร์</h1><p class="muted">กำลังโหลด…</p></div>`;
  const snap = await db.collection('orders').get();
  const all = snap.docs.map(d => d.data()).sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
  const byMenu = {}, byTable = {};
  let glasses = 0;
  for (const o of all) for (const it of o.items) {
    glasses += it.qty; byMenu[it.name] = (byMenu[it.name] || 0) + it.qty;
    byTable[o.table] = byTable[o.table] || { orders: new Set(), qty: 0 }; byTable[o.table].orders.add(o.no); byTable[o.table].qty += it.qty;
  }
  const tOrder = t => { const i = TABLES.indexOf(t); return i < 0 ? 999 : i; };
  const csv = [['ออเดอร์', 'เวลา', 'โต๊ะ', 'เมนู', 'จำนวน', 'หมายเหตุ', 'สถานะ']];
  for (const o of all) for (const it of o.items) csv.push([o.no, o.createdAt?.toDate?.().toLocaleString('th-TH') || '', o.table, it.name, it.qty, it.note || '', o.status]);
  app.innerHTML = `<div class="rep">
    <h1 style="font-weight:300;letter-spacing:.06em"><b style="color:var(--red)">X</b>-CLUSIVE NIGHT · สรุปออเดอร์</h1>
    <div class="kpi"><div>ออเดอร์<b>${all.length}</b></div><div>แก้วทั้งหมด<b>${glasses}</b></div><div>โต๊ะที่สั่ง<b>${Object.keys(byTable).length}</b></div></div>
    <p><button class="ghost" id="csv">ดาวน์โหลด CSV</button> <button class="ghost" onclick="print()">พิมพ์</button></p>
    <h2>ตามเมนู</h2><table><tr><th>เมนู</th><th class="n">แก้ว</th></tr>${Object.entries(byMenu).sort((a, b) => b[1] - a[1]).map(([n, q]) => `<tr><td>${esc(n)}</td><td class="n">${q}</td></tr>`).join('')}</table>
    <h2>ตามโต๊ะ</h2><table><tr><th>โต๊ะ</th><th class="n">ออเดอร์</th><th class="n">แก้ว</th></tr>${Object.entries(byTable).sort((a, b) => tOrder(a[0]) - tOrder(b[0])).map(([t, v]) => `<tr><td>${esc(t)}</td><td class="n">${v.orders.size}</td><td class="n">${v.qty}</td></tr>`).join('')}</table>
    <h2>รายการทั้งหมด</h2><table><tr><th>#</th><th>เวลา</th><th>โต๊ะ</th><th>รายการ</th><th>สถานะ</th></tr>${all.map(o => `<tr><td>${o.no}</td><td>${timeStr(o.createdAt)}</td><td>${esc(o.table)}</td><td>${o.items.map(i => `${i.qty}× ${esc(i.name)}${i.note ? ` <span class="muted">(${esc(i.note)})</span>` : ''}`).join('<br>')}</td><td>${esc(o.status)}</td></tr>`).join('')}</table></div>`;
  $('#csv').onclick = () => {
    const txt = '\ufeff' + csv.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv' })); a.download = 'x-clusive-night-drinks.csv'; a.click();
  };
}

/* ---------- QR A5 ---------- */
function renderQR() {
  const base = location.origin + location.pathname;
  app.innerHTML = `<div class="qrtop noprint"><b>QR ${TABLES.length} โต๊ะ</b><span class="muted">A5 หน้าละโต๊ะ</span>
    <button class="primary" style="width:auto;margin-left:auto" onclick="print()">พิมพ์ / บันทึก PDF</button></div><div id="g"></div>`;
  const g = $('#g');
  for (const t of TABLES) {
    const pg = document.createElement('div'); pg.className = 'qrpage';
    pg.innerHTML = `${LOGO}<div class="tl">${isVip(t) ? 'TABLE' : 'TABLE · โต๊ะ'}</div><div class="tn ${isVip(t) ? 'vip' : ''}">${esc(t)}</div>
      <div class="q"></div><div class="hint">สแกนเพื่อสั่งเครื่องดื่ม<small>Scan to order your drink</small></div>`;
    g.appendChild(pg);
    new QRCode(pg.querySelector('.q'), { text: `${base}?table=${encodeURIComponent(t)}`, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M });
  }
}
